name: screensaver-validation

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  web-and-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate screensaver monorepo
        run: bash tools/release/ci/verify-web.sh

  windows-wrapper:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Node dependencies
        shell: pwsh
        run: npm ci
      - name: Validate contracts and wrapper layout
        shell: pwsh
        run: npm run test:monorepo
      - name: Fetch WebView2 SDK
        shell: pwsh
        run: |
          nuget install Microsoft.Web.WebView2 -ExcludeVersion -OutputDirectory "$env:RUNNER_TEMP\webview2"
          "WEBVIEW2_SDK_DIR=$env:RUNNER_TEMP\webview2\Microsoft.Web.WebView2\build\native" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
      - name: Build Windows wrapper
        shell: pwsh
        run: npm run build:native:windows

  macos-wrapper:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Node dependencies
        run: npm ci
      - name: Validate contracts and wrapper layout
        run: npm run test:monorepo
      - name: Build macOS wrapper
        run: npm run build:native:macos

  linux-placeholder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Node dependencies
        run: npm ci
      - name: Prepare Linux placeholder
        run: |
          chmod +x apps/native/linux/run-screensaver.sh
          npm run build:screensaver
          npm run test:monorepo
          test -f apps/native/linux/pulse-of-humanity.xml