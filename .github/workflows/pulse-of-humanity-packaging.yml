name: pulse-of-humanity-packaging

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Node dependencies
        shell: pwsh
        run: npm ci

      - name: Generate population contract
        shell: pwsh
        run: node tools/generate-population-contract/generate.mjs

      - name: Build screensaver web bundle
        shell: pwsh
        run: npm run build:screensaver

      - name: Sync native assets
        shell: pwsh
        run: npm run sync:native-assets

      - name: Run monorepo tests
        shell: pwsh
        run: npm run test:monorepo

      - name: Run population compile check
        shell: pwsh
        run: python3 -m py_compile shared/population.py

      - name: Run native layout smoke test
        shell: pwsh
        run: node tests/native-smoke/verify-layout.mjs

      - name: Run screensaver population test
        shell: pwsh
        run: node tests/screensaver/test-population.mjs

      - name: Create universal screensaver ZIP
        shell: pwsh
        run: node tools/release/screensaver-scripts/build-zip.mjs

      - name: Install WebView2 SDK
        shell: pwsh
        run: |
          nuget install Microsoft.Web.WebView2 -ExcludeVersion -OutputDirectory "$env:RUNNER_TEMP\webview2"
          "WEBVIEW2_SDK_DIR=$env:RUNNER_TEMP\webview2\Microsoft.Web.WebView2\build\native" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y

      - name: Install Visual Studio Build Tools
        shell: pwsh
        run: |
          if (-not (Get-Command cl.exe -ErrorAction SilentlyContinue)) {
            choco install visualstudio2022buildtools --package-parameters "--add Microsoft.VisualStudio.Workload.VCTools --includeRecommended --passive --norestart" -y
          }

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build Windows screensaver wrapper
        shell: pwsh
        run: npm run build:native:windows

      - name: Build Windows installer (NSIS)
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $releaseDir = Join-Path $PWD "dist\releases\$version\windows"
          New-Item -ItemType Directory -Path $releaseDir -Force | Out-Null
          Copy-Item "apps/native/windows/build/PulseOfHumanity.scr" "$releaseDir/pulse-of-humanity-windows-scr-v$version.scr" -Force
          $nsisScript = Join-Path $env:RUNNER_TEMP "pulse-of-humanity-installer.nsi"
          @"
          Name "Pulse of Humanity Screensaver"
          OutFile "$releaseDir\pulse-of-humanity-windows-installer-v$version.exe"
          InstallDir "`$LOCALAPPDATA\PulseOfHumanityScreensaver"
          RequestExecutionLevel user
          Page directory
          Page instfiles
          Section "Install"
            SetOutPath "`$INSTDIR"
            File /r "apps\native\windows\build\*"
          SectionEnd
          "@ | Set-Content -Path $nsisScript -Encoding utf8
          & makensis $nsisScript

      - name: Sign Windows installer
        shell: pwsh
        env:
          WINDOWS_CERT: ${{ secrets.WINDOWS_CERT }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERT) -or [string]::IsNullOrWhiteSpace($env:WINDOWS_CERT_PASSWORD)) {
            Write-Host "Windows signing secrets not provided; skipping signing."
            exit 0
          }
          $version = (Get-Content VERSION -Raw).Trim()
          $releaseDir = Join-Path $PWD "dist\releases\$version\windows"
          $installerPath = Join-Path $releaseDir "pulse-of-humanity-windows-installer-v$version.exe"
          $certPath = Join-Path $env:RUNNER_TEMP "windows-signing-cert.pfx"
          [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:WINDOWS_CERT))
          signtool sign /f $certPath /p "$env:WINDOWS_CERT_PASSWORD" /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $installerPath

      - name: Create Windows checksums
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $releaseDir = Join-Path $PWD "dist\releases\$version\windows"
          $scrPath = Join-Path $releaseDir "pulse-of-humanity-windows-scr-v$version.scr"
          $exePath = Join-Path $releaseDir "pulse-of-humanity-windows-installer-v$version.exe"
          $sumFile = Join-Path $releaseDir "SHA256SUMS.txt"
          $scrHash = (Get-FileHash -Algorithm SHA256 $scrPath).Hash.ToLower()
          $exeHash = (Get-FileHash -Algorithm SHA256 $exePath).Hash.ToLower()
          "$scrHash  $(Split-Path $scrPath -Leaf)" | Out-File -FilePath $sumFile -Encoding utf8
          "$exeHash  $(Split-Path $exePath -Leaf)" | Out-File -FilePath $sumFile -Encoding utf8 -Append

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-assets
          path: |
            apps/native/windows/build/**
            dist/releases/pulse-of-humanity-screensaver-v*.zip
            dist/releases/*/windows/**
          if-no-files-found: error

  macos-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Node dependencies
        run: npm ci

      - name: Generate population contract
        run: node tools/generate-population-contract/generate.mjs

      - name: Build screensaver web bundle
        run: npm run build:screensaver

      - name: Sync native assets
        run: npm run sync:native-assets

      - name: Run monorepo tests
        run: npm run test:monorepo

      - name: Run population compile check
        run: python3 -m py_compile shared/population.py

      - name: Run native layout smoke test
        run: node tests/native-smoke/verify-layout.mjs

      - name: Run screensaver population test
        run: node tests/screensaver/test-population.mjs

      - name: Create universal screensaver ZIP
        run: node tools/release/screensaver-scripts/build-zip.mjs

      - name: Install Xcode command line tools
        run: xcode-select -p || xcode-select --install

      - name: Build macOS screensaver bundle
        run: npm run build:native:macos

      - name: Package macOS .saver into .dmg
        run: |
          VERSION="$(tr -d '\r\n' < VERSION)"
          RELEASE_DIR="dist/releases/${VERSION}/macos"
          mkdir -p "$RELEASE_DIR"
          cp -R "apps/native/macos/build/PulseOfHumanity.saver" "$RELEASE_DIR/PulseOfHumanity.saver"
          hdiutil create \
            -volname "Pulse of Humanity Screensaver" \
            -srcfolder "$RELEASE_DIR/PulseOfHumanity.saver" \
            -ov -format UDZO \
            "$RELEASE_DIR/pulse-of-humanity-macos-screensaver-v${VERSION}.dmg"

      - name: Import macOS signing certificate
        env:
          MACOS_CERT_BASE64: ${{ secrets.MACOS_CERT_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_CERT_IDENTITY: ${{ secrets.MACOS_CERT_IDENTITY }}
        run: |
          if [[ -z "${MACOS_CERT_BASE64}" || -z "${MACOS_CERT_PASSWORD}" || -z "${MACOS_CERT_IDENTITY}" ]]; then
            echo "macOS signing secrets not provided; skipping certificate import."
            exit 0
          fi
          KEYCHAIN_PATH="$RUNNER_TEMP/pulse-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          CERT_PATH="$RUNNER_TEMP/macos-cert.p12"
          echo "${MACOS_CERT_BASE64}" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "${MACOS_CERT_PASSWORD}" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

      - name: Sign macOS artifacts
        env:
          MACOS_CERT_BASE64: ${{ secrets.MACOS_CERT_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_CERT_IDENTITY: ${{ secrets.MACOS_CERT_IDENTITY }}
        run: |
          if [[ -z "${MACOS_CERT_BASE64}" || -z "${MACOS_CERT_PASSWORD}" || -z "${MACOS_CERT_IDENTITY}" ]]; then
            echo "macOS signing secrets not provided; skipping codesign."
            exit 0
          fi
          VERSION="$(tr -d '\r\n' < VERSION)"
          RELEASE_DIR="dist/releases/${VERSION}/macos"
          codesign --force --deep --timestamp --options runtime --sign "${MACOS_CERT_IDENTITY}" "$RELEASE_DIR/PulseOfHumanity.saver"
          codesign --force --timestamp --sign "${MACOS_CERT_IDENTITY}" "$RELEASE_DIR/pulse-of-humanity-macos-screensaver-v${VERSION}.dmg"

      - name: Notarize macOS DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [[ -z "${APPLE_ID}" || -z "${APPLE_APP_SPECIFIC_PASSWORD}" || -z "${APPLE_TEAM_ID}" ]]; then
            echo "Apple notarization secrets not provided; skipping notarization."
            exit 0
          fi
          VERSION="$(tr -d '\r\n' < VERSION)"
          RELEASE_DIR="dist/releases/${VERSION}/macos"
          xcrun notarytool submit "$RELEASE_DIR/pulse-of-humanity-macos-screensaver-v${VERSION}.dmg" \
            --apple-id "${APPLE_ID}" \
            --password "${APPLE_APP_SPECIFIC_PASSWORD}" \
            --team-id "${APPLE_TEAM_ID}" \
            --wait
          xcrun stapler staple "$RELEASE_DIR/pulse-of-humanity-macos-screensaver-v${VERSION}.dmg"

      - name: Create macOS checksums
        run: |
          VERSION="$(tr -d '\r\n' < VERSION)"
          RELEASE_DIR="dist/releases/${VERSION}/macos"
          (
            cd "$RELEASE_DIR"
            tar -cf - PulseOfHumanity.saver | shasum -a 256 | awk '{print $1 "  PulseOfHumanity.saver"}' > SHA256SUMS.txt
            shasum -a 256 "pulse-of-humanity-macos-screensaver-v${VERSION}.dmg" >> SHA256SUMS.txt
          )

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-release-assets
          path: |
            apps/native/macos/build/**
            dist/releases/pulse-of-humanity-screensaver-v*.zip
            dist/releases/*/macos/**
          if-no-files-found: error

  linux-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Node dependencies
        run: npm ci

      - name: Generate population contract
        run: node tools/generate-population-contract/generate.mjs

      - name: Build screensaver web bundle
        run: npm run build:screensaver

      - name: Sync native assets
        run: npm run sync:native-assets

      - name: Run monorepo tests
        run: npm run test:monorepo

      - name: Run population compile check
        run: python3 -m py_compile shared/population.py

      - name: Run native layout smoke test
        run: node tests/native-smoke/verify-layout.mjs

      - name: Run screensaver population test
        run: node tests/screensaver/test-population.mjs

      - name: Create universal screensaver ZIP
        run: node tools/release/screensaver-scripts/build-zip.mjs

      - name: Install Linux packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev rpm xscreensaver

      - name: Build Linux screensaver module
        run: npm run build:native:linux --if-present

      - name: Package Linux artifacts
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < VERSION)"
          RELEASE_DIR="dist/releases/${VERSION}/linux"
          PKG_ROOT="$RUNNER_TEMP/pulse-linux-${VERSION}"
          mkdir -p "$RELEASE_DIR" "$PKG_ROOT"

          mkdir -p "$PKG_ROOT/usr/local/share/pulse-of-humanity/screensaver"
          mkdir -p "$PKG_ROOT/usr/local/bin"
          mkdir -p "$PKG_ROOT/usr/share/xscreensaver/config"

          cp -R dist/screensaver-web/* "$PKG_ROOT/usr/local/share/pulse-of-humanity/screensaver/"
          cp apps/native/linux/run-screensaver.sh "$PKG_ROOT/usr/local/bin/pulse-of-humanity-screensaver"
          cp apps/native/linux/pulse-of-humanity.xml "$PKG_ROOT/usr/share/xscreensaver/config/pulse-of-humanity.xml"
          chmod +x "$PKG_ROOT/usr/local/bin/pulse-of-humanity-screensaver"

          tar -C "$PKG_ROOT" -czf "$RELEASE_DIR/pulse-of-humanity-linux-v${VERSION}.tar.gz" .

          DEB_ROOT="$RUNNER_TEMP/pulse-deb-${VERSION}"
          mkdir -p "$DEB_ROOT/DEBIAN" "$DEB_ROOT/usr"
          cp -R "$PKG_ROOT/usr/." "$DEB_ROOT/usr/"
          cat > "$DEB_ROOT/DEBIAN/control" <<EOF
          Package: pulse-of-humanity
          Version: ${VERSION}
          Section: graphics
          Priority: optional
          Architecture: amd64
          Maintainer: Pulse of Humanity <opensource@pulse-of-humanity.org>
          Description: Pulse of Humanity offline screensaver runtime
          EOF
          dpkg-deb --build "$DEB_ROOT" "$RELEASE_DIR/pulse-of-humanity-linux-v${VERSION}.deb"

          RPM_ROOT="$RUNNER_TEMP/rpmbuild"
          mkdir -p "$RPM_ROOT/SOURCES" "$RPM_ROOT/SPECS" "$RPM_ROOT/BUILD" "$RPM_ROOT/BUILDROOT" "$RPM_ROOT/RPMS" "$RPM_ROOT/SRPMS"
          TAR_NAME="pulse-of-humanity-${VERSION}.tar.gz"
          tar -C "$PKG_ROOT" -czf "$RPM_ROOT/SOURCES/$TAR_NAME" .
          cat > "$RPM_ROOT/SPECS/pulse-of-humanity.spec" <<EOF
          Name: pulse-of-humanity
          Version: ${VERSION}
          Release: 1%{?dist}
          Summary: Pulse of Humanity offline screensaver runtime
          License: MIT
          BuildArch: x86_64
          Source0: ${TAR_NAME}

          %description
          Pulse of Humanity offline screensaver runtime.

          %prep
          %setup -q -c -T
          tar -xzf %{SOURCE0}

          %build

          %install
          mkdir -p %{buildroot}
          cp -a * %{buildroot}/

          %files
          /usr/local/share/pulse-of-humanity/screensaver
          /usr/local/bin/pulse-of-humanity-screensaver
          /usr/share/xscreensaver/config/pulse-of-humanity.xml

          %changelog
          * Tue Jan 01 2026 Pulse of Humanity <opensource@pulse-of-humanity.org> - ${VERSION}-1
          - Automated build
          EOF
          rpmbuild --define "_topdir $RPM_ROOT" -bb "$RPM_ROOT/SPECS/pulse-of-humanity.spec"
          cp "$RPM_ROOT"/RPMS/x86_64/*.rpm "$RELEASE_DIR/pulse-of-humanity-linux-v${VERSION}.rpm"

      - name: Create Linux checksums
        run: |
          VERSION="$(tr -d '\r\n' < VERSION)"
          RELEASE_DIR="dist/releases/${VERSION}/linux"
          (
            cd "$RELEASE_DIR"
            sha256sum \
              "pulse-of-humanity-linux-v${VERSION}.tar.gz" \
              "pulse-of-humanity-linux-v${VERSION}.deb" \
              "pulse-of-humanity-linux-v${VERSION}.rpm" \
              > SHA256SUMS.txt
          )

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-release-assets
          path: |
            dist/releases/pulse-of-humanity-screensaver-v*.zip
            dist/releases/*/linux/**
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs:
      - windows-build
      - macos-build
      - linux-build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Resolve version
        id: version
        run: echo "value=$(tr -d '\r\n' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: "*-release-assets"
          path: .
          merge-multiple: true

      - name: Stamp release metadata
        run: node tools/release/stamp-release.mjs

      - name: Package release artifacts
        run: node tools/release/package-release-artifacts.mjs

      - name: Create GitHub release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.version.outputs.value }}
          release_name: Pulse of Humanity v${{ steps.version.outputs.value }}
          commitish: ${{ github.sha }}
          draft: false
          prerelease: false

      - name: Upload release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.value }}"
          find "dist/releases/${VERSION}" -type f -print0 | while IFS= read -r -d '' asset; do
            gh release upload "v${VERSION}" "$asset" --clobber
          done
          for asset in \
            "dist/releases/pulse-of-humanity-screensaver-v${VERSION}.zip" \
            "dist/releases/artifact-manifest.json" \
            "dist/releases/release-metadata.json"; do
            if [[ -f "$asset" ]]; then
              gh release upload "v${VERSION}" "$asset" --clobber
            fi
          done
