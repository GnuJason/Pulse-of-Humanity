<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Pulse of Humanity{% endblock %}</title>

  <!-- Preconnect hints -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- Fonts: JetBrains Mono (counter/display) + Instrument Sans (body) -->
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS (compiled) -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}" />

  <style>
    :root {
      --accent: #00ffcc;
      --accent-glow: rgba(0, 255, 204, 0.7);
      --accent-strong: rgba(0, 255, 204, 1);
      --accent-dim: rgba(0, 255, 204, 0.15);
      --bg-primary: #000000;
      --bg-secondary: #0a0a0f;
      --bg-card: #12121a;
      --bg-card-alt: #1a1a26;
      --border-color: rgba(255, 255, 255, 0.08);
      --text-primary: #f0f0f5;
      --text-secondary: #8a8a9a;
      --text-muted: #55556a;
      --success: #4ade80;
      --danger: #f87171;
      --font-display: 'JetBrains Mono', 'Courier New', monospace;
      --font-body: 'Instrument Sans', system-ui, sans-serif;
    }

    body {
      font-family: var(--font-body);
      background: var(--bg-secondary);
      color: var(--text-primary);
    }

    /* Reduced-motion support */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
      .reveal { opacity: 1; }
      .reveal-hero { opacity: 1; transform: none; }
    }

    /* Page-load reveal choreography */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    @keyframes scaleIn {
      from { opacity: 0; transform: scale(0.96); }
      to   { opacity: 1; transform: scale(1); }
    }

    .reveal {
      opacity: 0;
      animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .reveal-fade {
      opacity: 0;
      animation: fadeIn 1s ease-out forwards;
    }

    .reveal-scale {
      opacity: 0;
      animation: scaleIn 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .reveal-hero {
      opacity: 0;
      transform: translateY(8px);
      animation: heroIn 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      animation-delay: var(--hero-delay, 0ms);
    }

    @keyframes heroIn {
      to { opacity: 1; transform: translateY(0); }
    }

    .reveal-delay-1 { animation-delay: 0.15s; }
    .reveal-delay-2 { animation-delay: 0.30s; }
    .reveal-delay-3 { animation-delay: 0.50s; }
    .reveal-delay-4 { animation-delay: 0.70s; }
    .reveal-delay-5 { animation-delay: 0.90s; }

    /* Typography scale */
    .heading-xl {
      font-family: var(--font-display);
      font-size: clamp(2rem, 5vw, 3.5rem);
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.1;
    }

    .heading-lg {
      font-size: clamp(1.5rem, 3vw, 2.25rem);
      font-weight: 700;
      letter-spacing: -0.01em;
      line-height: 1.2;
    }

    .heading-md {
      font-size: clamp(1.125rem, 2vw, 1.5rem);
      font-weight: 600;
      line-height: 1.3;
    }

    .heading-sm {
      font-size: 1.125rem;
      font-weight: 600;
      line-height: 1.4;
    }

    .body-lg {
      font-size: 1.125rem;
      line-height: 1.7;
    }

    .body-md {
      font-size: 1rem;
      line-height: 1.6;
    }

    /* Atmospheric footer */
    .site-footer {
      position: relative;
      background: linear-gradient(to top, rgba(0, 255, 204, 0.03), transparent);
      border-top: 1px solid var(--border-color);
    }

    .site-footer::before {
      content: '';
      position: absolute;
      inset: 0;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      pointer-events: none;
    }

    {% block extra_styles %}{% endblock %}
  </style>
  {% block head_extra %}{% endblock %}
</head>
<body class="{% block body_class %}min-h-screen{% endblock %}">

  <!-- Skip to content -->
  <a href="#main-content"
     class="sr-only focus:not-sr-only focus:fixed focus:top-3 focus:left-3 focus:z-[100]
            focus:bg-[var(--accent)] focus:text-black focus:px-4 focus:py-2 focus:rounded-md
            focus:font-semibold focus:shadow-lg focus:outline-none">
    Skip to content
  </a>

  {% block body %}
  <main id="main-content">
    {% block content %}{% endblock %}
  </main>
  {% endblock %}

  <footer class="site-footer z-10 mt-auto py-4 sm:py-5 px-4 sm:px-6 {% block footer_class %}{% endblock %}">
    <nav aria-label="Footer navigation" class="relative z-10 text-xs text-center max-w-4xl mx-auto" style="color: var(--text-secondary);">
      {% block footer_content %}
      <p class="mb-1">
        <a href="/about" class="hover:text-[var(--accent)] transition-colors">About</a>
        <span class="mx-1.5 opacity-30">/</span>
        <a href="/screensaver" class="hover:text-[var(--accent)] transition-colors">Screensaver</a>
        <span class="mx-1.5 opacity-30">/</span>
        <a href="/privacy" class="hover:text-[var(--accent)] transition-colors">Privacy</a>
        <span class="mx-1.5 opacity-30">/</span>
        <a href="/contact" class="hover:text-[var(--accent)] transition-colors">Contact</a>
      </p>
      <p class="mt-1 opacity-50">&copy; <span id="current-year"></span> Pulse of Humanity</p>
      {% endblock %}
    </nav>
  </footer>

  <script>
    var yearEl = document.getElementById('current-year');
    if (yearEl) yearEl.textContent = new Date().getFullYear();
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
