<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Pulse of Humanity — Screensaver</title>
  <meta name="description" content="A cinematic, hover-driven screensaver of global population dynamics." />
  <meta name="color-scheme" content="dark" />
  <link rel="stylesheet" href="styles/screensaver.css" />
</head>
<body>
  <main class="ss-stage" aria-label="Pulse of Humanity screensaver">
    <div id="ss-map"></div>
    <div class="ss-vignette-overlay" aria-hidden="true"></div>
    <div id="ss-counter-host"></div>
    <div id="ss-panel-host"></div>
  </main>

  <!-- Vendor: TopoJSON client (UMD; exposes window.topojson). -->
  <script src="vendor/topojson-client.min.js"></script>

  <!-- file:// fallback. If fetch() succeeds, this object is simply ignored.
       Loading it as a <script> avoids CORS/file-protocol fetch blocks. -->
  <script src="assets/world-110m.js"></script>

  <script type="module">
    import { start } from "./src/main.js";
    start().catch((err) => {
      console.error("[screensaver] boot failure:", err);
      const el = document.createElement("pre");
      el.style.cssText = "position:fixed;inset:24px;color:#c9a36b;font:12px ui-monospace;white-space:pre-wrap;";
      el.textContent = "Screensaver failed to start:\n" + err.message;
      document.body.appendChild(el);
    });
  </script>
</body>
</html>
