services:
  - type: web
    name: pulse-of-humanity
    env: python
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: gunicorn --config gunicorn.conf.py app:app
    envVars:
      - key: FLASK_DEBUG
        value: "0"
      - key: RUN_UPDATER
        value: "1"
      - key: POP_ANCHOR_MONTH
        value: "1"
      - key: POP_ANCHOR_DAY
        value: "1"
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: ADMIN_REANCHOR_TOKEN
        generateValue: true
      - key: PORT
        value: "10000"
    healthCheckPath: /health
    autoDeploy: false